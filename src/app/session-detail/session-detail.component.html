<mat-toolbar class="gap-8">
    <button mat-icon-button (click)="goBack()" aria-label="Back to dashboard">
        <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="session-date">{{ analysis()?.sessionId | date: "yyyy-MM-dd HH:mm" }}</span>
    <span class="flex-1"></span>

    @if (!error() && analysis()?.deviceName; as deviceName) {
        <span class="device-name xs-hide">{{ deviceName }}</span>
    }
</mat-toolbar>
@if (loading()) {
    <div class="loading-container flex-col items-center justify-center gap-16">
        <mat-spinner diameter="70"></mat-spinner>
        <p>Loading session...</p>
    </div>
} @else if (error(); as errorMessage) {
    <div class="error-container flex-col items-center justify-center gap-16">
        <p>{{ errorMessage }}</p>
        <button mat-raised-button (click)="goBack()">Back to Dashboard</button>
    </div>
} @else if (analysis(); as data) {
    <mat-tab-group class="flex-1">
        <mat-tab label="Summary">
            <app-session-summary [analysis]="data" />
        </mat-tab>
        <mat-tab label="Strokes">
            <app-session-strokes [strokes]="data.strokes" [laps]="data.laps" />
        </mat-tab>
    </mat-tab-group>
}
