name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:

  repository_dispatch:
    types: [esp-rowing-monitor-release]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Set up NodeJs
        uses: actions/setup-node@v6

      - name: 🚧 Npm install & Build
        run: |
          npm install
          npm run build -- --base-href=/ESPRowingMonitor-WebGUI/

      - name: 📄 Create 404 fallback
        run: cp dist/esp-rowing-monitor-client/browser/index.html dist/esp-rowing-monitor-client/browser/404.html

      - name: 📎 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist/esp-rowing-monitor-client/browser/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5